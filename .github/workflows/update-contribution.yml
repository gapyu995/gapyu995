name: 🐍 更新霓虹贪吃蛇贡献图

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0:00 运行（北京时间 8:00）
  workflow_dispatch:      # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install @octokit/rest dotenv

      - name: 创建 .env 文件
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" > .env

      - name: 获取贡献数据
        run: node fetchData.js

      - name: 生成贡献图
        run: node generateGame.js

      - name: 提交并推送更新
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🐍 自动更新贪吃蛇贡献图"
          file_pattern: snake-contribution.svg
