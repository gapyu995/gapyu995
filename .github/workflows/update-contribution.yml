name: Update contribution snake SVG

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch all contribution days
        run: node fetchData.js
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          CONTRIBUTIONS_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test simulation rules
        run: npm test

      - name: Generate one-shot SMIL SVG
        run: npm run generate

      - name: Commit updated contribution animation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🐍 Update contribution snake SVG"
          file_pattern: snake-contribution.svg README.md
